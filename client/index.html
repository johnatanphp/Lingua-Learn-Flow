<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <meta name="description" content="Aprende idiomas de forma divertida y efectiva con LinguaLearn. Lecciones gamificadas, IA conversacional y clases en vivo." />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LinguaLearn" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="LinguaLearn - Aprende idiomas" />
    <meta property="og:description" content="Plataforma de aprendizaje de idiomas gamificada con IA" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>LinguaLearn - Aprende idiomas</title>
    <style>
      #app-shell {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #f8fafc; z-index: 9999;
        transition: opacity 0.4s ease;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      #app-shell.ready { opacity: 0; pointer-events: none; }
      .shell-logo {
        width: 80px; height: 80px; border-radius: 22px;
        background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 16px; font-size: 40px;
        box-shadow: 0 8px 32px rgba(124,58,237,0.3);
      }
      .shell-title { font-size: 22px; font-weight: 800; color: #1e293b; margin: 0; }
      .shell-sub { font-size: 13px; color: #64748b; margin: 6px 0 24px; }
      .shell-bar { width: 200px; height: 5px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
      .shell-fill {
        height: 100%; background: linear-gradient(90deg, #7c3aed, #06b6d4);
        border-radius: 999px; animation: lpulse 1.4s ease-in-out infinite;
      }
      @keyframes lpulse { 0%,100%{width:15%} 50%{width:85%} }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <div class="shell-logo">📚</div>
      <p class="shell-title">LinguaLearn</p>
      <p class="shell-sub">Aprende · Practica · Domina</p>
      <div class="shell-bar"><div class="shell-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
